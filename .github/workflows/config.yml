name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'CHANGELOG.md'

permissions:
  contents: write
  pull-requests: read
  issues: read

# Changelog commits are pushed back to main, so never run two of these at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Make script executable
      run: chmod +x ./dev-setup.sh

    - name: Setup environment
      run: |
        if [ -x "$(command -v bash)" ]; then
          bash ./dev-setup.sh --tester
        else
          sh ./dev-setup.sh --tester
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bin-artifact
        path: bin
        retention-days: 1

  validate_index:
    needs: download
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: bin-artifact
        path: bin
    - name: Validate index
      run: |
        cp index.json index.json.bak
        java -jar bin/extension-tester.jar --ci --generate-index
        # Compare parsed JSON, not raw bytes: different extension-tester builds
        # indent differently (tabs vs spaces), which is not a real index change.
        if diff -q <(jq -S . index.json.bak) <(jq -S . index.json) > /dev/null 2>&1; then
          echo "Index is up to date"
        else
          echo "Index file is not up to date. Regenerate it with:"
          echo "  java -jar bin/extension-tester.jar --ci --generate-index"
          echo "Committed (<) vs generated (>):"
          diff <(jq -S . index.json.bak) <(jq -S . index.json) || true
          exit 1
        fi

  validate_metadata:
    needs: download
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: bin-artifact
        path: bin
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v41
      with:
        since_last_remote_commit: 'true'
    - name: Validate metadata
      run: |
        if [ -n "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
          echo "Changed files found"
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            case "$file" in
              *.lua)
                echo "Validating Lua file: $file"
                java -jar bin/extension-tester.jar --ci --validate-metadata "$file"
                ;;
              *)
                echo "Skipping non-Lua file: $file"
                ;;
            esac
          done
        else
          echo "No files changed, skipping validation"
        fi

  test:
    needs: download
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: bin-artifact
        path: bin
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v41
      with:
        since_last_remote_commit: 'true'
    - name: Test
      run: |
        if [ -n "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
          echo "Changed files found"
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            case "$file" in
              *.lua)
                echo "Testing Lua file: $file"
                java -jar bin/extension-tester.jar --ci "$file"
                ;;
             *)
                echo "Skipping non-Lua file: $file"
                ;;
            esac
         done
        else
          echo "No files changed, skipping tests"
        fi

  # Only runs once test, validate_index and validate_metadata have all passed.
  changelog:
    needs: [test, validate_index, validate_metadata]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure CHANGELOG.md exists
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "_This changelog is automatically generated._" >> CHANGELOG.md
          fi

      - name: Generate Changelog
        id: changelog
        uses: ardalanamini/auto-changelog@v4.0.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-types: |
            feat: ✨ Features
            fix: 🐛 Bug Fixes
            chore: 🔧 Maintenance
            docs: 📝 Documentation
            refactor: ♻️ Refactors
            test: 🧪 Tests
            ci: 🔄 CI/CD
          default-commit-type: Other
          release-name: v1.0.0
          mention-authors: true
          mention-new-contributors: true
          include-commit-links: true
          use-github-autolink: true

      # Process changelog output to match desired format
      - name: Process Changelog
        run: |
          # Get the raw changelog
          CHANGELOG="${{ steps.changelog.outputs.changelog }}"
          echo "$CHANGELOG" > temp_changelog.md
          sed 's/^- /\* /g' temp_changelog.md > formatted_changelog.md
          sed -E 's#([a-f0-9]{7})[a-f0-9]* \& #[\1](https://github.com/${{ github.repository }}/commit/\1) \& #g' formatted_changelog.md > intermediate_changelog.md
          sed -E 's#([a-f0-9]{7})[a-f0-9]* by @([a-zA-Z0-9._-]+),?#\[\1](https://github.com/${{ github.repository }}/commit/\1) by ([@\2](https://github.com/\2))#g' intermediate_changelog.md > CHANGELOG.md
          rm temp_changelog.md formatted_changelog.md intermediate_changelog.md

      - name: Commit and Push Changelog (if changed)
        run: |
          AUTHOR_NAME=$(git log -1 --pretty=format:'%an')
          AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add CHANGELOG.md
          git diff --cached --quiet || {
            git commit -m "docs(changelog): update changelog"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }
